name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # Use npm with support for the version-specific allowScripts policy.
      - name: Set npm version
        run: npm install --global npm@11.21.2
      - name: Install locked dependencies
        run: npm ci
      # Generate Next.js route types before tsc reads next-env.d.ts on a clean checkout.
      - name: Build
        run: npm run build
      - name: Format, type-check, and lint
        run: npm run qa
      - name: Test production server
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/portfolio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/portfolio-server.log
            exit 1
          fi
          npm test
